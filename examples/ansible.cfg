[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
# Lower this if many hosts share the same satellite link; every fork transfers
# module files over SSH at the same time.
forks = 20
interpreter_python = auto_silent
callbacks_enabled = ansible.posix.profile_tasks
# Seconds to wait while establishing (and reading from) an SSH connection
timeout = 60
# Fact gathering is slow over high-latency links
gather_timeout = 120

[ssh_connection]
# Pipelining is not used, so every task copies its module to the host first.
# Persistent control connections avoid repeating the SSH handshake for each of
# those transfers.
#
# retries: reconnect this many times when SSH itself fails (exit code 255),
# e.g. when a satellite link drops mid-task. Applies to every task.
retries = 10
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60 -o ConnectionAttempts=3
