---
# Internal variables, evaluated lazily (secrets never become facts).

_ef_major_version: "{{ elastic_fleet_version.split('.')[0] }}"
_ef_repo_name: "elastic-agent-{{ _ef_major_version }}.x"
# Repositories enabled for the role's own dnf tasks (none when repo_source is 'none')
_ef_package_repos: >-
  {{ [_ef_repo_name] if elastic_fleet_repo_source == 'elastic'
     else ([elastic_fleet_satellite_repo_id] if elastic_fleet_repo_source == 'satellite' else []) }}
_ef_python: "{{ ansible_facts['python']['executable'] | default('/usr/bin/python3') }}"
# apt source on Ubuntu. The elasticsearch, kibana, logstash and elastic_fleet roles
# write the same key and source, so a host running several of them ends up with one
# definition (apt refuses two definitions of one URI with different keys).
_ef_apt_keyring: /etc/apt/keyrings/elastic.asc
_ef_apt_source: "/etc/apt/sources.list.d/elastic-{{ _ef_major_version }}.x.sources"
# dnf on Enterprise Linux, apt on Ubuntu. A variable rather than a fact, because
# ansible-role-elastic-agent runs repository.yml and install.yml without facts.yml.
_ef_pkg_mgr: "{{ 'apt' if ansible_facts['os_family'] == 'Debian' else 'dnf' }}"

# Written by elastic-agent once it is enrolled in Fleet (RPM and Debian package layout).
_ef_fleet_enc_file: "{{ elastic_fleet_agent_conf_dir }}/fleet.enc"
# Fingerprint of the settings the agent was last enrolled with, root only.
_ef_state_file: "{{ elastic_fleet_agent_conf_dir }}/.ansible-fleet-server-state.json"

_ef_valid_client_auth: [none, optional, required]

# ---------------------------------------------------------------------------
# TLS material
# ---------------------------------------------------------------------------
# Manually supplied certificates first, then any issued by ansible-role-elastic-tls into
# elastic_tls_ssl_certificates, so a manual entry always wins when both use one name.
_ef_ssl_certificates: "{{ (ssl_certificates | default([])) + (elastic_tls_ssl_certificates | default([])) }}"
_ef_ssl_entry: >-
  {{ _ef_ssl_certificates
     | selectattr('name', 'equalto', elastic_fleet_ssl_certificate_name)
     | first | default({}) }}
_ef_server_ca_content: "{{ _ef_ssl_entry.ca.content | default(elastic_fleet_ssl_ca_certificate, true) }}"
_ef_server_ca_path: >-
  {{ '' if (_ef_server_ca_content | length) > 0
     else (_ef_ssl_entry.ca.path | default(elastic_fleet_ssl_ca_certificate_path, true)) }}
_ef_es_ca_content: "{{ elastic_fleet_elasticsearch_ca_certificate | default(_ef_server_ca_content, true) }}"
_ef_es_ca_path: >-
  {{ '' if (_ef_es_ca_content | length) > 0
     else (elastic_fleet_elasticsearch_ca_certificate_path | default(_ef_server_ca_path, true)) }}
_ef_kibana_ca_content: "{{ elastic_fleet_kibana_ca_certificate | default(_ef_server_ca_content, true) }}"
_ef_kibana_ca_path: >-
  {{ '' if (_ef_kibana_ca_content | length) > 0
     else (elastic_fleet_kibana_ca_certificate_path | default(_ef_server_ca_path, true)) }}
_ef_has_server_ca: "{{ (_ef_server_ca_content | length) > 0 or (_ef_server_ca_path | length) > 0 }}"
_ef_has_kibana_ca: "{{ (_ef_kibana_ca_content | length) > 0 or (_ef_kibana_ca_path | length) > 0 }}"
_ef_ssl_key_passphrase: "{{ _ef_ssl_entry.key.passphrase | default('') }}"

_ef_server_cert_file: "{{ elastic_fleet_ssl_dir }}/fleet-server.crt"
_ef_server_key_file: "{{ elastic_fleet_ssl_dir }}/fleet-server.key"
_ef_server_key_passphrase_file: "{{ elastic_fleet_ssl_dir }}/fleet-server.key.passphrase"
_ef_server_ca_file: "{{ elastic_fleet_ssl_dir }}/ca.crt"
_ef_es_ca_file: "{{ elastic_fleet_ssl_dir }}/elasticsearch-ca.crt"
_ef_kibana_ca_file: "{{ elastic_fleet_ssl_dir }}/kibana-ca.crt"
_ef_service_token_file: "{{ elastic_fleet_ssl_dir }}/service-token"

# ---------------------------------------------------------------------------
# Enrollment
# ---------------------------------------------------------------------------
# No secret appears on the command line: the service token and the key
# passphrase are passed as files, so the arguments can be published as a fact
# and shown in the process list.
_ef_enroll_argv: >-
  {{ ['/usr/bin/elastic-agent', 'enroll', '--force',
      '--url=' ~ elastic_fleet_url,
      '--fleet-server-es=' ~ elastic_fleet_elasticsearch_url,
      '--fleet-server-es-ca=' ~ _ef_es_ca_file,
      '--fleet-server-service-token-path=' ~ _ef_service_token_file,
      '--fleet-server-policy=' ~ elastic_fleet_policy_id,
      '--fleet-server-host=' ~ elastic_fleet_bind_host,
      '--fleet-server-port=' ~ (elastic_fleet_port | string),
      '--fleet-server-cert=' ~ _ef_server_cert_file,
      '--fleet-server-cert-key=' ~ _ef_server_key_file,
      '--fleet-server-client-auth=' ~ elastic_fleet_client_auth,
      '--fleet-server-timeout=' ~ (elastic_fleet_enroll_timeout | string) ~ 's']
     + (['--fleet-server-cert-key-passphrase=' ~ _ef_server_key_passphrase_file]
        if (_ef_ssl_key_passphrase | length) > 0 else [])
     + (['--certificate-authorities=' ~ _ef_server_ca_file] if _ef_has_server_ca | bool else [])
     + elastic_fleet_enroll_extra_args }}

# ---------------------------------------------------------------------------
# Readiness / API access
# ---------------------------------------------------------------------------
_ef_status_url: "{{ elastic_fleet_url | regex_replace('/+$', '') }}/api/status"

# Any host in the play changing version
_ef_deployment_upgrade: >-
  {{ (ansible_play_hosts | map('extract', hostvars, '_ef_version_changing') | select | list | length) > 0 }}

_ef_kibana_url: "{{ elastic_fleet_kibana_url | regex_replace('/+$', '') }}"
_ef_kibana_basic_auth: "{{ (elastic_fleet_kibana_api_key | length) == 0 }}"
_ef_kibana_headers: >-
  {{ {'kbn-xsrf': 'ansible', 'elastic-api-version': '2023-10-31'}
     | combine({'Authorization': 'ApiKey ' ~ elastic_fleet_kibana_api_key}
               if not (_ef_kibana_basic_auth | bool) else {}) }}

_ef_es_auth_headers:
  Authorization: "Bearer {{ elastic_fleet_service_token }}"

# ufw (Ubuntu's firewall) is active
_ef_ufw_active: "{{ (_ef_ufw_state.stdout | default('')) is search('^Status: active', multiline=True) }}"
