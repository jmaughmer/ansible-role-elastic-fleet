---
# Checks the deployment the way production would notice: Fleet Server answers
# ONLINE on 8220 (with the test CA) and Kibana knows the Fleet Server host.
# Addresses come from the scenario's group_vars — hence the facts play first
# (own playbook run).
- name: Gather facts from every host
  hosts: all
  gather_facts: true
  tasks: []

- name: Verify Fleet Server
  hosts: fleet_server
  gather_facts: false
  become: true
  tasks:
    - name: Elastic Agent (running Fleet Server) is up and enabled
      ansible.builtin.systemd_service:
        name: elastic-agent
        state: started
        enabled: true

    # The proven assertion from ansible-role-elastic-agent's verify: Fleet
    # Server runs inside elastic-agent, and 8220 serves only the agent API
    # (curl /status there is a bare 404). The agent's own status reports the
    # Fleet connection. Status can exit non-zero with empty stdout while the
    # daemon finishes booting, so the wait only demands parsable JSON; the
    # health itself is asserted next.
    - name: Wait for the agent to report status
      ansible.builtin.command: /usr/bin/elastic-agent status --output json
      register: fleet_status
      changed_when: false
      failed_when: false
      until: fleet_status.rc == 0 and (fleet_status.stdout | trim | length > 0)
      retries: 24
      delay: 5

    # Verified against the live 9.5.4 status JSON: a Fleet Server host reports
    # components[] (id "fleet-server-default", state 2), not apps[].
    - name: The agent is connected to Fleet and Fleet Server is healthy
      vars:
        test_json: "{{ fleet_status.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - (test_json.FleetState | default(test_json.fleet_state)) in [2, 'HEALTHY']
          - test_json.state in [2, 'HEALTHY']
          - test_json.components | default([])
            | selectattr('id', 'match', '^fleet-server')
            | selectattr('state', 'in', [2, 'HEALTHY']) | list | length == 1
        fail_msg: "{{ fleet_status.stdout }}"

    - name: The package is at the role's default version
      ansible.builtin.command: dnf -q list installed elastic-agent
      register: fleet_package
      changed_when: false
      failed_when: test_default_version not in fleet_package.stdout

- name: Verify Kibana knows the deployment
  hosts: kibana
  gather_facts: false
  become: true
  vars:
    test_ca: /etc/pki/elastic-tls/certs/ca.crt
  tasks:
    - name: Kibana is available
      ansible.builtin.uri:
        url: "{{ test_kibana_url }}/api/status"
        url_username: "{{ test_admin_user }}"
        url_password: "{{ test_admin_password }}"
        force_basic_auth: true
        ca_path: "{{ test_ca }}"
        headers:
          kbn-xsrf: molecule
      register: kb_status
      until: (kb_status.json.status.overall.level | default('')) == 'available'
      retries: 12
      delay: 5

    - name: The Fleet Server host is registered and active
      ansible.builtin.uri:
        url: "{{ test_kibana_url }}/api/fleet/fleet_server_hosts"
        url_username: "{{ test_admin_user }}"
        url_password: "{{ test_admin_password }}"
        force_basic_auth: true
        ca_path: "{{ test_ca }}"
        headers:
          kbn-xsrf: molecule
      register: fleet_hosts

    - name: Assert the registered host points at this Fleet Server
      ansible.builtin.assert:
        that:
          - fleet_hosts.json | to_json is search(test_fleet_address)
        fail_msg: "fleet_server_hosts: {{ fleet_hosts.json | default({}) }}"
