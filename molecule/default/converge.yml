---
# The Elasticsearch and Fleet Server addresses are taken from facts, so they
# are gathered from every host first. The role is applied to every Fleet Server
# in one play, as in examples/playbook.yml, and included by the repository's
# path, which works whatever the roles path is. Molecule connects as root.
- name: Gather facts from every host
  hosts: all
  gather_facts: true
  tasks: []

- name: Converge
  hosts: fleet_server
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ test_role_dir }}"
