---
# The repo's own deployment playbook, unmodified (it runs ansible-role-
# elastic-tls first, which delegates issuance to the CA host, then deploys
# Fleet Server). import_playbook keeps its basedir.
#
# The facts play mirrors ansible-role-elastic-agent's converge: the scenario's
# test_* group_vars (and the fleet role's elastic_fleet_elasticsearch_url)
# read every host's facts, and converge is its own playbook run — without
# this, the role's preflight sees an empty URL.
- name: Gather facts from every host
  hosts: all
  gather_facts: true
  tasks: []

- name: Deploy Fleet Server
  ansible.builtin.import_playbook: ../../examples/playbook.yml
